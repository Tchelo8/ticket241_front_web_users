<!doctype html>
<html lang="fr" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket241 · Billetterie du Gabon</title>
    <meta name="description" content="Concerts, matchs, festivals : achetez vos billets au Gabon avec Airtel Money ou Moov Money." />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..700&display=swap" rel="stylesheet" />
    <script>
      // Pose le thème avant le premier rendu pour éviter un flash.
      (function () {
        var t;
        try { t = JSON.parse(localStorage.getItem('t241.prefs') || '{}').state.theme; } catch (e) {}
        if (t !== 'paper' && t !== 'ink' && t !== 'mono') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
